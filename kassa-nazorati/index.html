<title>Kassa Nazorati 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Geologica","Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EFF3F0;--surface:#FFFFFF;--surface-2:#E6ECE8;--surface-3:#DCE4DF;
  --line:#D3DDD7;--line-2:#BFCCC5;
  --ink:#102019;--ink-2:#3E5047;--ink-3:#687970;
  --brand:#0A6B53;--brand-2:#07553F;--brand-ink:#FFFFFF;--brand-soft:#D8EEE5;
  --gold:#8F5C0C;--gold-soft:#F6E8CC;
  --red:#B3362F;--red-soft:#F8E0DD;
  --blue:#2459B8;--blue-soft:#DFE7F8;
  --violet:#6B45AD;--violet-soft:#ECE4F8;
  --m-cash:#0A6B53;--m-uzcard:#2459B8;--m-humo:#B7861C;--m-click:#2E96D6;--m-payme:#13A39A;--m-nasiya:#6B45AD;
  --paper:#FFFFFF;--paper-ink:#1A1A1A;
  --shadow:0 1px 2px rgba(16,32,25,.06),0 10px 28px rgba(16,32,25,.09);
  --ovl:rgba(8,20,14,.5);
  --r-s:8px;--r-m:12px;--r-l:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1310;--surface:#121C18;--surface-2:#18251F;--surface-3:#203029;
  --line:#243530;--line-2:#34493F;
  --ink:#E4EEE8;--ink-2:#A7B8AF;--ink-3:#7F9087;
  --brand:#38C197;--brand-2:#5ED3AE;--brand-ink:#04170F;--brand-soft:#123A2D;
  --gold:#E1AC4E;--gold-soft:#3A2B10;--red:#EF7A72;--red-soft:#3D1D1B;--blue:#7BA3F0;--blue-soft:#18284A;--violet:#B294EC;--violet-soft:#2B2142;
  --m-cash:#38C197;--m-uzcard:#7BA3F0;--m-humo:#E1AC4E;--m-click:#6EC1F2;--m-payme:#45D0C4;--m-nasiya:#B294EC;
  --paper:#F4F2EC;--paper-ink:#161616;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--ovl:rgba(0,0,0,.62);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1310;--surface:#121C18;--surface-2:#18251F;--surface-3:#203029;
  --line:#243530;--line-2:#34493F;
  --ink:#E4EEE8;--ink-2:#A7B8AF;--ink-3:#7F9087;
  --brand:#38C197;--brand-2:#5ED3AE;--brand-ink:#04170F;--brand-soft:#123A2D;
  --gold:#E1AC4E;--gold-soft:#3A2B10;--red:#EF7A72;--red-soft:#3D1D1B;--blue:#7BA3F0;--blue-soft:#18284A;--violet:#B294EC;--violet-soft:#2B2142;
  --m-cash:#38C197;--m-uzcard:#7BA3F0;--m-humo:#E1AC4E;--m-click:#6EC1F2;--m-payme:#45D0C4;--m-nasiya:#B294EC;
  --paper:#F4F2EC;--paper-ink:#161616;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--ovl:rgba(0,0,0,.62);
  color-scheme:dark}

html{height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;font-family:var(--f-disp);font-weight:600;text-wrap:balance}
p{margin:0}
.num,.tbl,.money{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.muted{color:var(--ink-3)}
.grow{flex:1}
.nowrap{white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.fill{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.big{min-height:56px;font-size:17px;border-radius:14px;padding:12px 20px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.lnk{border:0;background:none;padding:6px 0;color:var(--brand);font-weight:600;cursor:pointer;text-align:left}
.lnk:disabled{color:var(--ink-3);cursor:default}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
label.f small{font-weight:500;color:var(--ink-3)}
.inp,label.f input,label.f select,label.f textarea{min-height:46px;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);font-weight:500;color:var(--ink);width:100%;font-size:16px}
label.f textarea{min-height:90px;resize:vertical;font-family:var(--f-mono);font-size:13.5px;line-height:1.5}
.inp:focus,label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;min-height:42px}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.frm{display:grid;gap:14px}
.frm2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.frm3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:20px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:13px;padding:4px;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:38px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line-2);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-height:38px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.35}
.badge.ok{background:var(--brand-soft);color:var(--brand)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.badge.warn{background:var(--gold-soft);color:var(--gold)}
.badge.info{background:var(--blue-soft);color:var(--blue)}
.badge.vio{background:var(--violet-soft);color:var(--violet)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:5px 11px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.ok::before{background:var(--brand)}
.pill.warn{color:var(--gold);background:var(--gold-soft)}.pill.warn::before{background:var(--gold)}
.pill.bad{color:var(--red);background:var(--red-soft)}.pill.bad::before{background:var(--red)}
.pill.info::before{background:var(--blue)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:0 12px;min-height:48px;flex:1;min-width:0;color:var(--ink-3)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--ink);padding:10px 0}
.empty{padding:34px 16px;text-align:center;color:var(--ink-3);grid-column:1/-1}
.note{font-size:13.5px;color:var(--ink-3)}
.warnbox{border-radius:14px;padding:13px 15px;background:var(--gold-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.warnbox b{color:var(--gold)}
.infobox{border-radius:14px;padding:13px 15px;background:var(--blue-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--blue) 35%,transparent)}
.badbox{border-radius:14px;padding:13px 15px;background:var(--red-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--red) 40%,transparent)}
.badbox b{color:var(--red)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .r{text-align:right;white-space:nowrap}
.tbl tr.tot td{font-weight:700;border-bottom:0;background:var(--surface-2)}
.tbl.hover tbody tr[data-a]{cursor:pointer}
.tbl.hover tbody tr[data-a]:hover td{background:var(--surface-2)}
.tbl td small{display:block;color:var(--ink-3);font-size:12.5px}
.neg{color:var(--red)}.plus{color:var(--brand)}
.kv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.kv td{padding:8px 0;border-bottom:1px solid var(--line)}
.kv td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.kv tr.sum td{font-weight:700;border-bottom:2px solid var(--ink-3)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:92px minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;overflow-y:auto}
.rail .brand{color:var(--brand);margin-bottom:10px;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--brand-soft)}
.rail .brand svg{width:30px;height:30px}
.navi{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;padding:9px 2px;border-radius:14px;border:0;background:transparent;color:var(--ink-2);font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.navi:hover{background:var(--surface-2)}
.navi.on{background:var(--brand-soft);color:var(--brand)}
.navi .dotn{position:absolute;top:4px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center}
.rail .spacer{flex:1}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);min-height:64px}
.top h1{font-size:20px}
.top .sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt{min-width:0}
.userchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:4px 10px 4px 4px;cursor:pointer;font-weight:600;min-height:46px;flex:none}
.userchip .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-family:var(--f-disp);font-weight:700}
.userchip small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px;line-height:1.1}
.userchip .un{text-align:left;line-height:1.25}
.content{flex:1;overflow:auto;min-height:0;padding:22px;-webkit-overflow-scrolling:touch}
.content.flush{padding:0;overflow:hidden}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.center{display:grid;place-items:center;min-height:100%;padding:24px 16px}
.blk{max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
.blk h2{font-size:24px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.sec>h2,.sec>h3,.sec .sh{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec .sh .grow{flex:1}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 20px;font-size:13.5px;font-weight:600;background:var(--gold-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.banner.bad{background:var(--red-soft)}
.banner.info{background:var(--blue-soft)}
.bnav{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .bnav{display:flex;grid-row:2;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .bnav .navi{flex:1 1 0;width:auto;min-width:0;padding:7px 2px;font-size:11px}
  .bnav .navi span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .main{grid-row:1}
  .top{padding:8px 14px;min-height:58px}
  .top h1{font-size:18px}
  .top .hide-m{display:none}
  .userchip .un{display:none}
  .userchip{padding:4px}
  .content{padding:16px}
  .frm2,.frm3{grid-template-columns:1fr}
  .banner{padding:8px 16px}
}
.more{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.more .navi{width:auto}
.moreback{position:fixed;inset:0;z-index:69;background:var(--ovl)}

/* ---------- lock / onboarding ---------- */
.lock{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100%;overflow:auto}
.lock-art{position:relative;overflow:hidden;background:#073D30;color:#F2F7F4;padding:36px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:0}
.lock-art::before{content:"";position:absolute;inset:-40%;background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 26px,rgba(233,190,98,.10) 26px 30px,rgba(255,255,255,0) 30px 58px),
  repeating-linear-gradient(65deg,rgba(255,255,255,0) 0 40px,rgba(120,220,180,.08) 40px 46px,rgba(255,255,255,0) 46px 86px);
  transform:rotate(-4deg);pointer-events:none}
.lock-art>*{position:relative}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow .mark{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.brandrow svg{width:28px;height:28px;stroke:#F2F7F4}
.wm{font-family:var(--f-disp);font-weight:700;font-size:21px;letter-spacing:.01em}
.wm small{display:block;font-family:var(--f-ui);font-weight:500;font-size:13px;opacity:.75;letter-spacing:0}
.clock{font-family:var(--f-disp);font-size:clamp(58px,8vw,108px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.la-date{font-size:18px;opacity:.85;margin-top:12px}
.la-foot{display:flex;flex-direction:column;gap:3px;font-size:15px}
.la-foot b{font-size:20px;font-family:var(--f-disp);font-weight:600}
.lock-pad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 20px;background:var(--bg);min-height:0}
.lock-pad h2{font-size:22px;text-align:center}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;width:min(460px,100%)}
.whob{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:96px}
.whob:hover{border-color:var(--brand)}
.whob .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-family:var(--f-disp);font-weight:700;font-size:17px}
.whob b{font-size:15px;line-height:1.2}
.whob small{color:var(--ink-3);font-size:12.5px}
.dots{display:flex;gap:14px;height:18px;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3)}
.dot.f{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:12px}
.key{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:26px;font-weight:600;cursor:pointer;display:grid;place-items:center;font-family:var(--f-disp)}
.key:active{background:var(--surface-2)}
.key.ok{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.key svg{width:26px;height:26px}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.demo{width:min(460px,100%);font-size:13.5px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:14px;padding:10px 14px}
.demo summary{cursor:pointer;font-weight:600}
.demo table{width:100%;margin-top:8px;border-collapse:collapse}
.demo td{padding:3px 0}
.demo td:last-child{text-align:right;font-weight:700;font-family:var(--f-mono)}
.onb{width:min(520px,100%);display:flex;flex-direction:column;gap:14px}
.onb h2{font-size:26px}
.choice{display:grid;gap:12px}
.card-choice{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.card-choice:hover{border-color:var(--brand)}
.card-choice .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.card-choice b{display:block;font-size:17px;font-family:var(--f-disp);font-weight:600;margin-bottom:3px}
.card-choice span{color:var(--ink-3);font-size:14px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--brand);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:799px){
  .lock{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .lock-art{padding:18px 18px 20px;flex-direction:row;align-items:flex-end;justify-content:space-between}
  .lock-art .la-date,.lock-art .la-foot{display:none}
  .clock{font-size:42px}
  .brandrow{align-self:flex-start}
  .keys{grid-template-columns:repeat(3,74px)}
  .key{height:58px}
  .who{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%;min-height:0}
.pos-left{display:flex;flex-direction:column;gap:12px;padding:16px 18px 0;min-height:0;min-width:0;position:relative}
.searchrow{display:flex;gap:10px}
.grid-products{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding-bottom:16px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:98px;padding:12px 13px 12px 15px;border-radius:15px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;position:relative;overflow:hidden}
.tile:hover{border-color:var(--brand)}
.tile:active{transform:scale(.98)}

  S.sumDirty.add(e.day); saveSoft('sd', [...S.sumDirty]);
  invalidate();
  schedulePush();
  return e;
}

/* Nasiya daftari: qarzga ta'sir qiladigan yozuvlar oylik hujjatga ham tushadi */
function debtItemsOf(e) {
  const base = { id: e.id, ts: e.ts, u: e.user, st: e.store, dev: e.dev };
  if (e.t === 'sale' && e.r && e.r.cust) { const a = nasiyaPart(e.r.pays); if (a) return [Object.assign({ cust: e.r.cust, a, k: 'sale', no: e.r.no }, base)]; }
  if ((e.t === 'void' || e.t === 'refund') && e.cust) { const a = nasiyaPart(e.pays); if (a) return [Object.assign({ cust: e.cust, a: -a, k: e.t, no: e.no }, base)]; }
  if (e.t === 'debt_pay') return [Object.assign({ cust: e.cust, a: -num(e.amount), k: 'pay', m: e.m }, base)];
  if (e.t === 'debt_adj') return [Object.assign({ cust: e.cust, a: num(e.amount), k: 'adj', note: e.reason }, base)];
  return [];
}
function debtFromEvent(e) {
  const items = debtItemsOf(e);
  if (!items.length) return;
  const m = mkey(e.day), d = S.dq[m] || { items: [], dirty: true };
  d.items = d.items.concat(items); d.dirty = true; S.dq[m] = d;
  saveCritical('dq', S.dq);
}

/* ============ Bazaga yuborish ============ */
let pushing = false, pushTimer = null, backoff = 0, lastSumFlush = 0;
function schedulePush(delay) { clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, delay == null ? 500 : delay); }
const dbErrCode = err => (err && err.code) || 'unavailable';
function handleDbErr(err, where) {
  const c = dbErrCode(err);
  S.lastErr = (where || '') + ': ' + c + (err && err.message ? ' (' + err.message + ')' : '');
  if (c === 'invalid_argument' || c === 'transform_error') { S.writeDenied = true; S.net = 'denied'; }
  else if (c === 'quota_exceeded') { S.quota = true; S.net = 'offline'; }
  else if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { S.revoked = true; S.net = 'revoked'; }
  else S.net = 'offline';
  return c;
}
async function dbSet(path, body) { return withTimeout(S.db.doc(path).set(body), 25000); }
async function dbDel(path) { return withTimeout(S.db.doc(path).delete(), 25000); }

function pendingCount() {
  let n = S.q.length + S.cq.length;
  for (const m in S.dq) if (S.dq[m].dirty) n++;
  if (S.devPending) n++;
  return n;
}
async function pushNow() {
  if (pushing || !S.db || S.passive || S.writeDenied || S.revoked || S.readOnly) return;
  if (navigator.onLine === false && S.mode === 'remote') { S.net = 'offline'; renderStatus(); return; }
  const sumsDue = S.sumDirty.size && (Date.now() - lastSumFlush > 90000 || S.flushSumsNow);
  if (!pendingCount() && !sumsDue) return;
  pushing = true; renderStatus();
  try {
    if (S.devPending && S.dev) { await dbSet('dev/' + S.dev.id, devDoc(S.dev)); S.devPending = false; LS.del('devp'); }
    while (S.cq.length) {
      const c = S.cq[0];
      await dbSet('cust/' + c.id, c);
      S.cq = S.cq.filter(x => x !== c); saveCritical('cq', S.cq);
    }
    while (S.q.length) {
      const c = S.q[0].c;
      const all = S.own.concat(S.q).filter(e => e.c === c && e.dev === S.dev.id).sort((a, b) => a.seq - b.seq);
      const [day, k] = c.split('~');
      await dbSet('ev/' + S.dev.id + '~' + c, { dev: S.dev.id, store: S.dev.store, day, k: +k, n: all.length, s0: all[0].seq, s1: all[all.length - 1].seq, events: all });
      const ids = new Set(all.map(e => e.id));
      const moved = S.q.filter(e => ids.has(e.id));
      S.q = S.q.filter(e => !ids.has(e.id));
      S.own = S.own.concat(moved);
      saveCritical('q', S.q);
      saveSoft('own', S.own);
    }
    for (const m of Object.keys(S.dq).sort()) {
      const d = S.dq[m]; if (!d.dirty) continue;
      await dbSet('debt/' + S.dev.id + '~' + m, { dev: S.dev.id, store: S.dev.store, month: m, items: d.items });
      if (S.dq[m] === d) { d.dirty = false; saveCritical('dq', S.dq); }
    }
    if (S.sumDirty.size && (Date.now() - lastSumFlush > 90000 || S.flushSumsNow)) {
      for (const day of [...S.sumDirty].sort()) {
        const body = buildSum(day);
        if (body) await dbSet('sum/' + S.dev.id + '~' + day, body);
        S.sumDirty.delete(day); saveSoft('sd', [...S.sumDirty]);
      }
      lastSumFlush = Date.now(); S.flushSumsNow = false;
    }
    S.net = S.mode === 'local' ? 'local' : 'online'; backoff = 0; S.quota = false;
    pruneLocal();
  } catch (err) {
    const c = handleDbErr(err, 'push');
    if (c !== 'invalid_argument' && c !== 'revoked' && c !== 'not_granted' && c !== 'quota_exceeded') { backoff = Math.min(60000, (backoff || 2500) * 2); schedulePush(backoff); }
    else if (c === 'quota_exceeded') schedulePush(60000);
  }
  pushing = false; renderStatus();
  if (S.q.length && !S.writeDenied && !S.revoked && S.net === 'online') schedulePush(300);
}
const devDoc = d => ({ id: d.id, name: d.name, type: d.type, store: d.store, code: num(d.code), inst: d.inst || null, at: d.at || Date.now(), by: d.by || null });

/* Qurilmada faqat kerakli yozuvlar qoladi: joriy bo'lak, ochiq smena va oxirgi kunlar */
function pruneLocal() {
  const keepFrom = addD(today(), -(OWN_KEEP_DAYS - 1));
  const curC = S.ctr && S.ctr.ck ? S.ctr.ck.day + '~' + S.ctr.ck.k : null;
  const qDays = new Set(S.q.map(e => e.day));
  /* ochiq smena kunlari to'liq saqlanadi (kun bo'yicha: kun yo to'liq bor, yo umuman yo'q) */
  const shDays = new Map(), open = new Set();
  for (const e of S.own.concat(S.q)) {
    if (!e.shift) continue;
    if (!shDays.has(e.shift)) shDays.set(e.shift, new Set());
    shDays.get(e.shift).add(e.day);
    if (e.t === 'shift_open') open.add(e.shift); else if (e.t === 'shift_close') open.delete(e.shift);
  }
  const openDays = new Set(); for (const s of open) for (const d of shDays.get(s) || []) openDays.add(d);
  const keep = S.own.filter(e => e.day >= keepFrom || e.c === curC || qDays.has(e.day) || S.sumDirty.has(e.day) || openDays.has(e.day));
  if (keep.length !== S.own.length) { S.own = keep; saveSoft('own', S.own); invalidate(); }
  const mKeep = mkey(addD(today(), -95));
  let ch = false;
  for (const m of Object.keys(S.dq)) if (!S.dq[m].dirty && m < mKeep) { delete S.dq[m]; ch = true; }
  if (ch) saveCritical('dq', S.dq);
}
/* Xotira to'lganda: keraksiz nusxalar olib tashlanadi */
function evictCaches(level) {
  LS.del('cfgc_old');
  if (level >= 1) {
    const curC = S.ctr && S.ctr.ck ? S.ctr.ck.day + '~' + S.ctr.ck.k : null;
    const t = today(), qDays = new Set(S.q.map(e => e.day));
    S.own = S.own.filter(e => e.day === t || e.c === curC || qDays.has(e.day));
    try { localStorage.setItem(LSP + 'own', JSON.stringify(S.own)); } catch (e) { LS.del('own'); }
  }
  if (level >= 2) { LS.del('wit'); LS.del('cfgc'); }
}

/* Kunlik xulosa (hisobotlar uchun kichik hujjat) */
function buildSum(day) {
  if (!S.dev) return null;
  const evs = S.own.concat(S.q).filter(e => e.day === day && e.dev === S.dev.id).sort((a, b) => a.seq - b.seq);
  if (!evs.length) return null;
  const A = accumulate(evs, true);
  let r0 = 0, r1 = 0;
  for (const e of evs) if (e.t === 'sale' && e.r) { const n = num(e.r.rn); if (!r0 || n < r0) r0 = n; if (n > r1) r1 = n; }
  const agg = A.days.get(S.dev.store + '|' + day) || newAgg();
  trimItems(agg, 40);
  return { dev: S.dev.id, store: S.dev.store, day, s0: evs[0].seq, s1: evs[evs.length - 1].seq, r0, r1, agg, shifts: [...A.shifts.values()], at: Date.now() };
}

/* ============ Bazadan o'qish (obunalar) ============ */
const subs = {};
function unsubAll() { for (const k in subs) { try { subs[k](); } catch (e) { } delete subs[k]; } }
function subErr(name) {
  return err => {
    const c = dbErrCode(err);
    S.lastErr = 'sub ' + name + ': ' + c;
    if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { S.revoked = true; S.net = 'revoked'; renderStatus(); render(); return; }
    delete subs[name];
    setTimeout(() => { if (S.db && !S.revoked && !subs[name]) subscribeOne(name); }, c === 'resource_exhausted' ? 30000 : 6000);
  };
}
function subscribeOne(name) {
  const db = S.db; if (!db) return;
  try {
    if (name === 'cfg') subs.cfg = db.collection('cfg').onSnapshot(onCfgSnap, subErr('cfg'));
    if (name === 'pins') subs.pins = db.doc('sec/pins').onSnapshot(onPinsSnap, subErr('pins'));
    if (name === 'dev') subs.dev = db.collection('dev').onSnapshot(onDevSnap, subErr('dev'));
    if (name === 'ev') subs.ev = db.collection('ev').where('day', '>=', S.liveFrom).onSnapshot(onEvSnap, subErr('ev'));
    if (name === 'cust') subs.cust = db.collection('cust').onSnapshot(onCustSnap, subErr('cust'));
    if (name === 'debt') subs.debt = db.collection('debt').onSnapshot(onDebtSnap, subErr('debt'));
  } catch (e) { S.lastErr = 'subscribe ' + name + ': ' + (e && e.message); }
}
function subscribeAll() { unsubAll(); ['cfg', 'pins', 'dev', 'ev', 'cust', 'debt'].forEach(subscribeOne); }

function onCfgSnap(snap) {
  let main = null, staff = null; const pd = new Map();
  for (const d of snap.docs) { const x = d.data(); if (d.id === 'main') main = x; else if (d.id === 'staff') staff = x; else if (d.id.startsWith('p-')) pd.set(d.id, x); }
  applyCfg(main, staff, pd);
  if (main) saveSoft('cfgc', { main, staff, pd: [...pd.entries()] });
  else LS.del('cfgc');
  S.cfgReady = true;
  if (S.net === 'connecting') S.net = S.mode === 'local' ? 'local' : 'online';
  afterCfg();
  invalidate(); renderSoon(true);
}
function applyCfg(main, staff, pd) {
  if (!main) { S.cfg = null; S.pshards = new Map(); return; }
  const shards = new Map([...pd.entries()].sort((a, b) => num(a[0].slice(2)) - num(b[0].slice(2))));
  const products = [];
  for (const [, x] of shards) for (const p of (x.items || [])) if (p && p.id) products.push(p);
  const list = (staff && Array.isArray(staff.list) ? staff.list : []).filter(u => u && u.id);
  S.cfg = { main: normMain(main), staff: list, products };
  S.pshards = shards;
  if (S.user && !S.readOnly) { const u = U(S.user.id); if (!u || !u.active) { S.user = null; S.modals = []; } else S.user = clone(u); }
}
function onPinsSnap(snap) { S.pins = (snap.exists && snap.data().pins) || {}; S.pinsReady = true; saveSoft('pinsc', S.pins); renderSoon(); }
function onDevSnap(snap) {
  const m = new Map(); for (const d of snap.docs) if (!d.id.startsWith('_')) m.set(d.id, d.data());
  S.devs = m; S.devsReady = true;
  if (S.dev && S.cfg && S.dev.inst === S.cfg.main.inst && !m.has(S.dev.id) && !S.devPending && S.canWrite !== false) { S.devPending = true; LS.set('devp', true); schedulePush(); }
  invalidate(); renderSoon();
}
function onEvSnap(snap) {
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id, prev = S.docEv.get(id) || [];
    if (ch.type === 'removed') { for (const x of prev) S.live.delete(x); S.docEv.delete(id); continue; }
    const data = ch.doc.data() || {}, ids = [];
    for (const e of (Array.isArray(data.events) ? data.events : [])) if (e && typeof e === 'object' && e.id && e.t) { S.live.set(e.id, e); ids.push(e.id); }
    const now = new Set(ids);
    for (const x of prev) if (!now.has(x)) S.live.delete(x);
    S.docEv.set(id, ids);
  }
  S.liveReady = true;
  invalidate(); renderSoon();
}
function onCustSnap(snap) { const m = new Map(); for (const d of snap.docs) m.set(d.id, d.data()); S.cust = m; S.custReady = true; invalidate(); renderSoon(); }
/* Mijozlar: bazadagilar + hali yuborilmaganlari */
function custGet(id) { return S.cust.get(id) || S.cq.find(c => c.id === id) || null; }
function allCustomers() { const m = new Map(S.cust); for (const c of S.cq) if (!m.has(c.id)) m.set(c.id, c); return [...m.values()]; }
function addCustomer(o) {
  const c = { id: 'c' + uid(10), name: o.name, phone: o.phone || '', note: o.note || '', at: Date.now(), by: S.user ? S.user.id : null, st: S.dev ? S.dev.store : null };
  const nq = S.cq.concat([c]);

}
function onDebtSnap(snap) { const m = new Map(); for (const d of snap.docs) m.set(d.id, d.data()); S.debt = m; invalidate(); renderSoon(); }

/* Kun almashsa, jonli oyna suriladi */
function checkDayChange() {
  const t = today();
  if (t === S.liveDay) return;
  S.liveDay = t; S.liveFrom = addD(t, -(LIVE_DAYS - 1));
  S.flushSumsNow = true; schedulePush(200);
  if (S.db && subs.ev) { try { subs.ev(); } catch (e) { } delete subs.ev; subscribeOne('ev'); }
  for (const [id, e] of S.live) if (e.day < S.liveFrom) S.live.delete(id);
  invalidate(); renderSoon();
}

/* ============ Oraliq ma'lumotlarini yuklash ============ */
/* Eski kunlar ma'lumoti 10 daqiqadan keyin qayta so'raladi: kechikib kelgan xulosalar ham ko'rinadi */
const RANGE_TTL = 10 * 60000;
const stale = s => !s || (s.st === 'err' && Date.now() - s.at > 20000) || (s.st === 'ok' && Date.now() - s.at > RANGE_TTL);
async function loadSums(from, to, force) {
  if (!S.db) return;
  const end = to < S.liveFrom ? to : addD(S.liveFrom, -1);
  const need = [];
  for (let d = from; d <= end; d = addD(d, 1)) { const s = S.sumDays.get(d); if (force ? !(s && s.st === 'loading') : stale(s)) need.push(d); }
  if (!need.length) return;
  need.forEach(d => S.sumDays.set(d, { st: 'loading', at: Date.now() }));
  try {
    const snap = await withTimeout(S.db.collection('sum').where('day', '>=', need[0]).where('day', '<=', need[need.length - 1]).get(), 30000);
    for (const d of snap.docs) S.sums.set(d.id, d.data());
    need.forEach(d => S.sumDays.set(d, { st: 'ok', at: Date.now() }));
  } catch (e) { need.forEach(d => S.sumDays.set(d, { st: 'err', at: Date.now() })); handleDbErr(e, 'sum'); }
  invalidate(); renderSoon();
}
async function loadRaw(from, to, force) {
  if (!S.db) return;
  const end = to < S.liveFrom ? to : addD(S.liveFrom, -1);
  const need = [];
  for (let d = from; d <= end; d = addD(d, 1)) { const s = S.rng.get(d); if (force ? !(s && s.st === 'loading') : stale(s)) need.push(d); }
  if (!need.length) return;
  need.forEach(d => S.rng.set(d, { st: 'loading', at: Date.now() }));
  try {
    const snap = await withTimeout(S.db.collection('ev').where('day', '>=', need[0]).where('day', '<=', need[need.length - 1]).get(), 30000);
    const seen = new Set();
    for (const d of snap.docs) {
      const data = d.data() || {}, ids = [];
      for (const e of (data.events || [])) if (e && e.id && e.t) { S.rngEv.set(e.id, e); ids.push(e.id); }
      const prev = S.rngDocEv.get(d.id) || []; const now = new Set(ids);
      for (const x of prev) if (!now.has(x)) S.rngEv.delete(x);
      S.rngDocEv.set(d.id, ids); seen.add(d.id);
    }
    /* o'chirilgan hujjatlar (masalan, tozalangan yoki buzilgan) keshdan ham olinadi */
    for (const [id, ids] of S.rngDocEv) { const day = (id.split('~')[1] || ''); if (day >= need[0] && day <= need[need.length - 1] && !seen.has(id)) { for (const x of ids) S.rngEv.delete(x); S.rngDocEv.delete(id); } }
    need.forEach(d => S.rng.set(d, { st: 'ok', at: Date.now() }));
  } catch (e) { need.forEach(d => S.rng.set(d, { st: 'err', at: Date.now() })); handleDbErr(e, 'raw'); }
  invalidate(); renderSoon();
}
const rawReady = day => day >= S.liveFrom ? S.liveReady : (S.rng.get(day) || {}).st === 'ok';
const sumReady = day => day >= S.liveFrom ? true : (S.sumDays.get(day) || {}).st === 'ok';

/* ============ Konfiguratsiyani yozish (faqat ilova egasi) ============ */
const wq = new Map();
function serialWrite(path, fn) {
  const prev = wq.get(path) || Promise.resolve();
  const p = prev.catch(() => { }).then(fn);
  wq.set(path, p);
  return p;
}
async function writeCfg(path, body) {
  if (!S.db) throw { code: 'unavailable', message: 'no db' };
  return serialWrite(path, () => dbSet(path, body));
}
async function saveMain(mutator) {
  const main = clone(S.cfg.main); mutator(main); main.v = Date.now();
  await writeCfg('cfg/main', main);
  S.cfg.main = normMain(main); invalidate();
}
async function saveStaff(list, pins) {
  await writeCfg('cfg/staff', { list, v: Date.now() });
  if (pins) await writeCfg('sec/pins', { pins, v: Date.now() });
  S.cfg.staff = list; if (pins) S.pins = pins; invalidate();
}
async function saveProducts(changed) {
  /* changed: mahsulotlar ro'yxati; har biri tegishli bo'lakka yoziladi */
  const shards = new Map([...S.pshards.entries()].map(([k, v]) => [k, (v.items || []).slice()]));
  const where = new Map(); for (const [k, items] of shards) for (const p of items) where.set(p.id, k);
  const touched = new Set();
  for (const p of changed) {
    let k = where.get(p.id);
    if (k) { const arr = shards.get(k); const i = arr.findIndex(x => x.id === p.id); arr[i] = p; }
    else {
      k = [...shards.keys()].find(x => shards.get(x).length < PSHARD_MAX);
      if (!k) { k = 'p-' + shards.size; shards.set(k, []); }
      shards.get(k).push(p); where.set(p.id, k);
    }
    touched.add(k);
  }
  for (const k of [...touched].sort()) await writeCfg('cfg/' + k, { items: shards.get(k), v: Date.now() });
  for (const k of touched) S.pshards.set(k, { items: shards.get(k) });
  const products = []; for (const [, x] of [...S.pshards.entries()].sort((a, b) => num(a[0].slice(2)) - num(b[0].slice(2)))) for (const p of (x.items || [])) products.push(p);
  S.cfg.products = products; invalidate();
}

/* ============ Qurilmani ro'yxatdan o'tkazish ============ */
async function assignCode(store) {
  const local = () => [...S.devs.values()].filter(d => d.store === store && d.type === 'cashier').reduce((m, d) => Math.max(m, num(d.code)), 0) + 1;
  if (!S.db || S.mode === 'local') return local();
  const ref = S.db.doc('lock/code-' + store);
  for (let i = 0; i < 8; i++) {
    let r = null;
    try { r = await withTimeout(ref.acquire({ holder: S.tabId, ttlMs: 15000 }), 15000); } catch (e) { r = null; }
    if (r && r.acquired) {
      const snap = await withTimeout(S.db.collection('dev').where('store', '==', store).get(), 20000);
      return snap.docs.map(d => d.data()).filter(d => d.type === 'cashier').reduce((m, d) => Math.max(m, num(d.code)), 0) + 1;
    }
    await sleep(900 + Math.random() * 900);
  }
  throw { code: 'unavailable', message: 'busy' };
}
async function registerDevice(o) {
  const code = o.type === 'cashier' ? await assignCode(o.store) : 0;
  const dev = { id: uid(12), name: o.name, type: o.type, store: o.store, code, inst: S.cfg.main.inst, at: Date.now(), by: o.by || null };
  if (S.db && S.canWrite !== false) await dbSet('dev/' + dev.id, devDoc(dev));
  resetLocalDevice();
  S.dev = dev; LS.set('dev', dev);
  S.ctr = { seq: 0, h: GENESIS, ts: 0, rec: 0, ck: null }; saveCritical('ctr', S.ctr);
  S.devs.set(dev.id, devDoc(dev));
  const was = S.user; S.user = o.by ? (U(o.by) || null) : null;
  emit('device', { name: dev.name, type: dev.type, code: dev.code, by: o.by || null });
  S.user = was;
  return dev;
}
function resetLocalDevice() {
  for (const k of ['dev', 'ctr', 'q', 'own', 'dq', 'cq', 'sd', 'cart', 'devp', 'wit', 'seen', 'lockout']) LS.del(k);
  S.dev = null; S.ctr = { seq: 0, h: GENESIS, ts: 0, rec: 0, ck: null }; S.q = []; S.own = []; S.dq = {}; S.cq = []; S.sumDirty = new Set();
  S.cart = { items: [], disc: null }; S.devPending = false; S.user = null; S.wit = {};

}
/* O'rnatish almashtirilgan bo'lsa (masalan, namuna tozalangan), qurilma qayta ulanadi */
function afterCfg() {

/* ============ Texnik xizmat: eski batafsil yozuvlarni tozalash (ilova egasi qurilmasida) ============ */
async function maintenance(force) {
  if (!S.db || !canAdminCfg() || S.readOnly || S.passive || !S.cfg) return;
  const last = num(LS.get('maint', 0));
  if (!force && Date.now() - last < 20 * 3600000) return;
  let keep = Math.max(30, num(CFG().keepDays) || 180);
  if (S.mode === 'local') keep = Math.min(keep, 35);
  const cutoff = addD(today(), -keep);
  try {
    if (S.mode === 'remote') {
      const l = await withTimeout(S.db.doc('lock/maint').acquire({ holder: S.tabId, ttlMs: 180000 }), 15000);
      if (!l || !l.acquired) return;
    }
    /* 1) Yetishmayotgan kunlik xulosalarni tiklash (yaqin kunlar) */
    await repairSums(addD(today(), -12), addD(S.liveFrom, -1));
    /* 2) Muddati o'tgan batafsil yozuvlar: avval xulosa tekshiriladi, keyin o'chiriladi */
    const snap = await withTimeout(S.db.collection('ev').where('day', '<', cutoff).get(), 60000);
    const groups = new Map();
    for (const d of snap.docs) { const x = d.data(); const g = x.dev + '~' + x.day; if (!groups.has(g)) groups.set(g, []); groups.get(g).push({ id: d.id, x }); }
    for (const [g, docs] of groups) {
      await ensureSumFromDocs(g, docs);
      for (const d of docs) await dbDel('ev/' + d.id);
    }
    LS.set('maint', Date.now()); S.maintInfo = { at: Date.now(), removed: snap.docs.length };
  } catch (e) { handleDbErr(e, 'maint'); }
}
async function ensureSumFromDocs(g, docs) {
  const evs = []; for (const d of docs) for (const e of (d.x.events || [])) evs.push(e);
  if (!evs.length) return;
  evs.sort((a, b) => a.seq - b.seq);
  const s = await withTimeout(S.db.doc('sum/' + g).get(), 20000);
  if (s.exists && num(s.data().s1) >= evs[evs.length - 1].seq) return;
  const A = accumulate(evs, true), f = evs[0];
  let r0 = 0, r1 = 0; for (const e of evs) if (e.t === 'sale' && e.r) { const n = num(e.r.rn); if (!r0 || n < r0) r0 = n; if (n > r1) r1 = n; }
  const agg = A.days.get(f.store + '|' + f.day) || newAgg(); trimItems(agg, 40);
  await dbSet('sum/' + g, { dev: f.dev, store: f.store, day: f.day, s0: evs[0].seq, s1: evs[evs.length - 1].seq, r0, r1, agg, shifts: [...A.shifts.values()], at: Date.now(), fixed: true });
}
async function repairSums(from, to) {
  if (from > to) return;
  const ev = await withTimeout(S.db.collection('ev').where('day', '>=', from).where('day', '<=', to).get(), 60000);
  const groups = new Map();
  for (const d of ev.docs) { const x = d.data(); const g = x.dev + '~' + x.day; if (!groups.has(g)) groups.set(g, []); groups.get(g).push({ id: d.id, x }); }

}

/* ---------- Barcha ma'lum yozuvlar ---------- */
let EVC = null, EVCv = -1;
function allEvents() {
  if (EVCv === MV && EVC) return EVC;
  const m = new Map();
  for (const [id, e] of S.rngEv) m.set(id, e);
  for (const [id, e] of S.live) m.set(id, e);
  for (const e of S.own) m.set(e.id, e);
  for (const e of S.q) m.set(e.id, e);
  EVC = [...m.values()].sort((a, b) => (a.ts - b.ts) || (a.dev < b.dev ? -1 : a.dev > b.dev ? 1 : a.seq - b.seq));
  EVCv = MV;

}

/* ---------- Cheklar va smenalar (batafsil) ---------- */
let MC = null, MCv = -1;
function model() {
  if (MCv === MV && MC) return MC;
  const evs = allEvents();
  const receipts = new Map(), byNo = new Map(), shiftEv = new Map(), lastSeen = new Map();
  for (const e of evs) {
    if (!lastSeen.has(e.dev) || lastSeen.get(e.dev) < e.ts) lastSeen.set(e.dev, e.ts);
    if (e.shift) { if (!shiftEv.has(e.shift)) shiftEv.set(e.shift, []); shiftEv.get(e.shift).push(e); }
    if (e.t === 'sale' && e.r) {
      const r = Object.assign({}, e.r, { store: e.store, dev: e.dev, user: e.user, shift: e.shift, ts: e.ts, day: e.day, status: 'paid', refunded: {}, refundedTotal: 0, refundedBy: {}, refunds: [], voidEv: null });
      r.items = Array.isArray(r.items) ? r.items : []; r.pays = Array.isArray(r.pays) ? r.pays : [];
      receipts.set(r.id, r); byNo.set(e.store + '|' + r.no, r.id);
    } else if (e.t === 'void') {
      const r = receipts.get(e.rid); if (r) { r.status = 'voided'; r.voidEv = e; }
    } else if (e.t === 'refund') {
      const r = receipts.get(e.rid);
      if (r) {
        for (const it of e.items || []) r.refunded[it.i] = r3((r.refunded[it.i] || 0) + qnum(it.qty));
        r.refundedTotal += num(e.total);
        for (const p of e.pays || []) r.refundedBy[p.m] = (r.refundedBy[p.m] || 0) + num(p.a);
        r.refunds.push(e);
      }
    }
  }
  const A = accumulate(evs, false);
  MC = { evs, receipts, byNo, shiftEv, lastSeen, shifts: A.shifts };
  MCv = MV;
  return MC;
}
function curShift() {
  if (!S.dev) return null;
  let r = null;
  for (const sh of model().shifts.values()) if (sh.dev === S.dev.id && sh.openTs && !sh.closed) { if (!r || sh.openTs > r.openTs) r = sh; }
  return r;
}

/* ---------- Davr ma'lumotlari ----------
   Har bir (qurilma, kun) juftligi uchun bitta manba: yaqin kunlar batafsil yozuvlardan,
   eskilari kunlik xulosalardan. Shu tufayli hech narsa ikki marta sanalmaydi. */
const PD = new Map(); let PDv = -1;
function periodData(from, to, sf) {
  if (PDv !== MV) { PD.clear(); PDv = MV; }
  const key = from + '|' + to + '|' + (sf || 'all') + '|' + (S.user ? S.user.id + S.user.role : '-');
  if (PD.has(key)) return PD.get(key);
  const okStore = st => (!S.user || canStore(S.user, st)) && (!sf || sf === 'all' || st === sf);
  const pre = addD(from, -2), myDev = S.dev ? S.dev.id : null;
  const localMax = new Map();
  for (const e of S.own.concat(S.q)) if (e.dev === myDev && e.day < S.liveFrom) localMax.set(e.day, Math.max(localMax.get(e.day) || 0, e.seq));
  const sumFor = new Map(); for (const s of S.sums.values()) sumFor.set(s.dev + '~' + s.day, s);
  const useRaw = (dev, day) => {
    if (day >= S.liveFrom) return true;
    if (dev !== myDev || !localMax.has(day)) return false;
    const s = sumFor.get(dev + '~' + day);
    return !(s && num(s.s1) >= localMax.get(day));
  };
  const evs = allEvents().filter(e => e.day >= pre && e.day <= to && okStore(e.store) && useRaw(e.dev, e.day));
  const A = accumulate(evs, true);
  const days = new Map(); let loading = false;
  for (let d = from; d <= to; d = addD(d, 1)) days.set(d, newAgg());
  for (const [k, a] of A.days) { const d = k.slice(k.indexOf('|') + 1); if (days.has(d)) mergeAgg(days.get(d), a); }
  for (const s of S.sums.values()) if (s.day >= from && s.day <= to && okStore(s.store) && !useRaw(s.dev, s.day)) mergeAgg(days.get(s.day), s.agg || newAgg());
  for (let d = from; d <= to; d = addD(d, 1)) if (d < S.liveFrom ? !sumReady(d) : !rawReady(d)) loading = true;
  const shifts = A.shifts;
  for (const s of S.sums.values()) if (s.day >= pre && s.day <= to && okStore(s.store) && !useRaw(s.dev, s.day)) for (const a of s.shifts || []) shifts.set(a.id, mergeShift(shifts.get(a.id), a));
  const list = [...shifts.values()].filter(sh => sh.openTs && dkey(sh.openTs) >= from && dkey(sh.openTs) <= to && okStore(sh.store)).sort((a, b) => b.openTs - a.openTs);

function sumDays(days) { const t = newAgg(); for (const a of days.values()) mergeAgg(t, a); return t; }
function periodEnsure(from, to) { if (S.db && from < S.liveFrom) loadSums(addD(from, -2), to); }

/* ---------- Nasiya (qarzlar) ---------- */
let DB_ = null, DBv = -1;
function debtBook() {
  if (DBv === MV && DB_) return DB_;
  const items = new Map();
  for (const d of S.debt.values()) for (const it of (d.items || [])) if (it && it.id) items.set(it.id + '|' + it.cust, it);
  for (const m in S.dq) for (const it of S.dq[m].items || []) items.set(it.id + '|' + it.cust, it);
  const bal = new Map(), led = new Map(), last = new Map();
  for (const it of items.values()) {
    bal.set(it.cust, (bal.get(it.cust) || 0) + num(it.a));
    if (!led.has(it.cust)) led.set(it.cust, []);
    led.get(it.cust).push(it);
    if (!last.has(it.cust) || last.get(it.cust) < it.ts) last.set(it.cust, it.ts);
  }
  for (const l of led.values()) l.sort((a, b) => b.ts - a.ts);

  DB_ = { bal, led, last, total, owing }; DBv = MV;
  return DB_;
}
const custName = id => { const c = custGet(id); return c ? c.name : 'Mijoz'; };

/* ---------- Zanjir tekshiruvi (yozuvlar o'chirilgan yoki o'zgartirilganmi) ---------- */
let CHN = null, CHNv = -1;
function chains() {
  if (CHNv === MV && CHN) return CHN;
  const byDev = new Map();
  const src = new Map([...S.rngEv, ...S.live]);
  for (const e of src.values()) { if (!byDev.has(e.dev)) byDev.set(e.dev, []); byDev.get(e.dev).push(e); }
  const res = new Map(), now = Date.now();
  let witCh = false;
  for (const [dev, list] of byDev) {
    list.sort((a, b) => a.seq - b.seq);
    const probs = [], bySeq = new Map();
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      bySeq.set(e.seq, e);
      if (!hashOk(e)) probs.push({ k: 'alt', seq: e.seq, ts: e.ts });
      if (i > 0) {
        const p = list[i - 1];
        if (e.seq === p.seq) probs.push({ k: 'dup', seq: e.seq, ts: e.ts });
        else if (e.seq > p.seq + 1) { if (now - e.ts > 15 * 60000) probs.push({ k: 'gap', from: p.seq + 1, to: e.seq - 1, ts: e.ts }); }
        else if (e.ph !== p.h) probs.push({ k: 'link', seq: e.seq, ts: e.ts });
      }
    }
    const w = S.wit[dev];
    if (w && w.day >= (list[0] ? list[0].day : '9999') && w.day >= S.liveFrom) {
      const x = bySeq.get(w.seq);
      if (!x) probs.push({ k: 'del', seq: w.seq, ts: w.ts || now });
      else if (x.h !== w.h) probs.push({ k: 'alt', seq: w.seq, ts: x.ts });
    }
    const top = list[list.length - 1];
    if (!probs.length && top && (!w || top.seq >= w.seq)) { S.wit[dev] = { seq: top.seq, h: top.h, day: top.day, ts: top.ts }; witCh = true; }
    res.set(dev, { n: list.length, from: list[0] ? list[0].seq : 0, to: top ? top.seq : 0, probs });
  }
  if (witCh) saveSoft('wit', S.wit);
  CHN = res; CHNv = MV;
  return CHN;
}

/* ---------- Ogohlantirishlar ---------- */
const ALERT_KIND = { void: 'Bekor qilish', disc: 'Chegirma', hours: 'Ish vaqti', var: 'Kassa farqi', streak: 'Takroriy farq', long: 'Uzoq smena', debt: 'Nasiya limiti', tamper: 'Jurnal butunligi' };
function alertsFor(from, to, sf) {
  const C = CFG(), out = [], now = Date.now();
  const P = periodData(from, to, sf);
  const byCashier = new Map();
  for (const sh of P.shifts) {
    const who = uname(sh.user);
    if (sh.voidN > num(C.voidAlert)) out.push({ id: 'v' + sh.id, ts: sh.lastTs || sh.openTs, lvl: 'warn', kind: 'void', store: sh.store, text: `${who} smenasida ${sh.voidN} ta chek bekor qilindi` });
    const end = sh.closed ? sh.closed.ts : now, lim = num(C.maxShiftH) * 3600000;
    if (lim > 0 && end - sh.openTs > lim) out.push({ id: 'l' + sh.id, ts: sh.closed ? sh.closed.ts : sh.openTs + lim, lvl: 'warn', kind: 'long', store: sh.store,
      text: sh.closed ? `${who} smenasi ${Math.round((end - sh.openTs) / 3600000)} soat davom etgan` : `${who} smenasi ${Math.floor((now - sh.openTs) / 3600000)} soatdan beri ochiq` });
    if (sh.closed) {
      const v = num(sh.closed.variance) + num(sh.corr);
      if (Math.abs(v) > num(C.varLimit)) out.push({ id: 'f' + sh.id, ts: sh.closed.ts, lvl: 'bad', kind: 'var', store: sh.store, text: `${who}: ${v < 0 ? 'kamomad' : 'ortiqcha'} ${som(Math.abs(v))}${sh.closed.reason ? '. Sabab: ' + sh.closed.reason : ''}` });
      if (!byCashier.has(sh.user)) byCashier.set(sh.user, []);
      byCashier.get(sh.user).push(sh);
    }
  }
  for (const [u, list] of byCashier) {
    list.sort((a, b) => a.closed.ts - b.closed.ts);
    let streak = 0;
    for (const sh of list) {
      if (Math.abs(num(sh.closed.variance) + num(sh.corr)) > num(C.varLimit)) { streak++; if (num(C.varStreak) > 1 && streak >= num(C.varStreak)) out.push({ id: 's' + sh.id, ts: sh.closed.ts + 1, lvl: 'bad', kind: 'streak', store: sh.store, text: `${uname(u)}: ketma-ket ${streak} smenada kassa farqi` }); }
      else streak = 0;
    }
  }
  for (const [d, a] of P.days) for (const f of a.flags || []) {
    const st = storeOfDev(f.dev);
    if (f.k === 'disc') out.push({ id: 'd' + f.dev + f.no, ts: f.ts, lvl: 'warn', kind: 'disc', store: st, text: `Chek ${f.no}: ${fq(f.pct)}% chegirma (${som(f.sum)})${f.by ? ', tasdiqladi: ' + uname(f.by) : ''}` });
    if (f.k === 'hours') out.push({ id: 'h' + f.dev + f.no, ts: f.ts, lvl: 'warn', kind: 'hours', store: st, text: `Ish vaqtidan tashqari sotuv ${hm(f.ts)} da, chek ${f.no}` });
    if (f.k === 'debt') out.push({ id: 'n' + f.dev + f.no, ts: f.ts, lvl: 'warn', kind: 'debt', store: st, text: `${custName(f.cust)}: nasiya limitdan oshdi, chek ${f.no} (${som(f.sum)})${f.by ? ', tasdiqladi: ' + uname(f.by) : ''}` });
  }
  if (to >= S.liveFrom && isBoss(S.user)) {
    for (const [dev, c] of chains()) for (const p of c.probs) {
      const st = storeOfDev(dev); if (sf && sf !== 'all' && st !== sf) continue;
      if (st && !canStore(S.user, st)) continue;
      const txt = p.k === 'gap' ? `${dname(dev)}: ${p.from === p.to ? '#' + p.from : '#' + p.from + '–#' + p.to} yozuvlar yo‘q` : p.k === 'del' ? `${dname(dev)}: ilgari ko‘rilgan #${p.seq} yozuv o‘chirilgan` : `${dname(dev)}: #${p.seq} yozuv o‘zgartirilgan`;
      out.push({ id: 't' + dev + p.k + (p.seq || p.from), ts: p.ts, lvl: 'bad', kind: 'tamper', store: st, text: txt });
    }
  }
  const seen = new Set();
  return out.filter(a => { if (seen.has(a.id)) return false; seen.add(a.id); return true; }).sort((a, b) => b.ts - a.ts);
}
const storeOfDev = id => { const d = DV(id); return d ? d.store : null; };

function demoHistory(stores, products, devs, custs, rnd) {
  /* har bir qurilma uchun alohida zanjir */
  const out = new Map();
  const now = Date.now(), t0 = today();
  const cashierOf = { 'st-chilonzor': 'u-sardor', 'st-yunusobod': 'u-madina' };
  const bossOf = { 'st-chilonzor': 'u-dilnoza', 'st-yunusobod': 'u-ega' };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

    const evs = []; let seq = 0, ph = GENESIS, rec = 0;
    const st = dv.store, cashier = cashierOf[st], boss = bossOf[st];
    const add = (t, ts, user, data) => {
      const e = Object.assign({ id: uid(16), t, ts, day: dkey(ts), dev: dv.id, store: st, user, seq: ++seq, ph }, data);
      e.c = e.day + '~0'; e.h = evHash(e); ph = e.h; evs.push(e); return e;
    };

      const day = addD(t0, -back), base = k2ts(day) - 12 * 3600000;
      let ts = base + (8 * 60 + Math.floor(rnd() * 8)) * 60000;
      if (ts > now) continue;

      const shift = uid(12), open = rnd() < 0.5 ? 200000 : 300000;
      add('shift_open', ts + 20000, cashier, { shift, cash: open });
      const endTs = back === 0 ? now - 4 * 60000 : base + (21 * 60 + 35) * 60000;
      const sales = []; let cashIn = open;
      let voided = false, refunded = back % 2 === 1, collected = false;
      ts += 6 * 60000;
      while (ts < endTs) {
        ts += (3 + Math.floor(rnd() * 11)) * 60000 + Math.floor(rnd() * 50000);
        if (ts >= endTs) break;
        const hour = new Date(ts).getHours();
        if (!collected && hour >= 14) {
          const amt = Math.max(0, Math.floor((cashIn - 400000) / 100000) * 100000);
          if (amt > 0) { add('cash', ts, cashier, { shift, kind: 'collection', amount: amt, reason: 'Kun o‘rtasida egaga topshirildi', person: 'Aziz Karimov', by: boss }); cashIn -= amt; }
          if (rnd() < 0.45) { add('cash', ts + 60000, cashier, { shift, kind: 'expense', amount: 25000, reason: 'Ichimlik suvi uchun', person: 'Suv yetkazuvchi', by: boss }); cashIn -= 25000; }
          collected = true; ts += 120000;
        }
        const n = 1 + Math.floor(rnd() * rnd() * 5);
        const items = [];
        for (let k = 0; k < n; k++) {
          const p = rnd() < 0.55 ? pick(products.filter(x => x.fav)) : pick(products);
          if (items.find(x => x.p === p.id)) continue;
          const qty = p.unit === 'kg' ? r3(0.3 + Math.floor(rnd() * 25) / 10) : 1 + Math.floor(rnd() * rnd() * 3);
          items.push({ p: p.id, name: p.name, qty, price: p.price, unit: p.unit });
        }
        if (rnd() < 0.05 && items.length) add('item_remove', ts - 30000, cashier, { shift, p: items[0].p, name: items[0].name, price: items[0].price, qty: 1 });
        const sub = items.reduce((s, it) => s + Math.round(it.price * it.qty), 0);
        let disc = 0, discPct = 0, discReason = '', discBy = null;
        if (rnd() < 0.04 && sub > 30000) { discPct = rnd() < 0.5 ? 5 : 10; disc = Math.round(sub * discPct / 100); discReason = discPct > 5 ? 'Aksiya' : 'Doimiy xaridor'; discBy = discPct > 5 ? boss : null; }
        const total = sub - disc;
        const x = rnd(); let pays, given = 0, change = 0, cust = null;
        if (x < 0.55) { pays = [{ m: 'cash', a: total }]; given = Math.ceil(total / 5000) * 5000 + (rnd() < 0.3 ? 5000 : 0); change = given - total; cashIn += total; }
        else if (x < 0.73) pays = [{ m: 'uzcard', a: total }];
        else if (x < 0.84) pays = [{ m: 'humo', a: total }];
        else if (x < 0.91) pays = [{ m: 'click', a: total }];
        else if (x < 0.96) pays = [{ m: 'payme', a: total }];
        else { cust = pick(custs).id; pays = [{ m: 'nasiya', a: total }]; }
        rec++;
        const r = { id: uid(12), rn: rec, no: dv.code + '-' + String(rec).padStart(6, '0'), items, sub, disc, discPct, discReason, discBy, total, pays, given, change };
        if (cust) r.cust = cust;
        const e = add('sale', ts, cashier, { shift, r });
        sales.push(e);
        if (!voided && hour >= 11 && rnd() < 0.08 && pays[0].m !== 'nasiya') {
          ts += 90000;
          add('void', ts, cashier, { shift, rid: r.id, no: r.no, amount: total, pays, items: items.map(i => ({ p: i.p, name: i.name, qty: i.qty, price: i.price })), reason: 'Xato urilgan', by: boss, cust: r.cust || null });
          if (pays[0].m === 'cash') cashIn -= total;
          voided = true;
        }
        if (refunded && hour >= 16 && sales.length > 5 && rnd() < 0.1) {
          const orig = sales[Math.floor(rnd() * (sales.length - 3))].r;
          if (orig.pays[0].m !== 'nasiya' && orig.items.length) {
            const it = orig.items[0], q = it.unit === 'dona' ? 1 : it.qty;
            const ratio = orig.sub ? orig.total / orig.sub : 1, amt = Math.min(Math.round(it.price * q * ratio), orig.total);
            ts += 60000;
            add('refund', ts, cashier, { shift, rid: orig.id, no: orig.no, items: [{ i: 0, qty: q, amount: amt, p: it.p, name: it.name }], total: amt, pays: [{ m: orig.pays[0].m, a: amt }], reason: 'Sifatsiz mahsulot', by: boss });
            if (orig.pays[0].m === 'cash') cashIn -= amt;
            refunded = false;
          }
        }
        if (rnd() < 0.015) { const c = pick(custs); ts += 30000; add('debt_pay', ts, cashier, { shift, cust: c.id, amount: 50000, m: 'cash' }); cashIn += 50000; }
      }
      if (back > 0) {
        const cts = endTs + 5 * 60000;
        const shEvs = evs.filter(e => e.shift === shift);
        const A = accumulate(shEvs, false), sh = A.shifts.get(shift), T = shiftTotals(sh);
        const variance = back === 2 ? -18000 : back === 4 ? -2000 : back === 5 ? 1000 : 0;
        const terms = {}; for (const m of ['uzcard', 'humo', 'click', 'payme']) terms[m] = T.sys[m] || 0;

      }
    }
    out.set(dv.id, { evs, rec });
  }
  return out;
}

function quickCash(t) {

  return out.slice(0, 5);
}

  if (m.method === 'mix') return mixSum(m) === total;

}

function lineRefund(r, i, q) { const ratio = num(r.sub) ? num(r.total) / num(r.sub) : 1; return Math.round(num(r.items[i].price) * q * ratio); }
function refundCalc(r, qmap) {
  const items = []; let total = 0, allRest = true;
  r.items.forEach((it, i) => {
    const left = r3(qnum(it.qty) - (r.refunded[i] || 0)), q = Math.min(qmap[i] || 0, Math.max(0, left));
    if (q > 0) { const a = lineRefund(r, i, q); items.push({ i, qty: q, amount: a, p: it.p, name: it.name }); total += a; }
    if (q < left) allRest = false;
  });
  const maxLeft = num(r.total) - r.refundedTotal;
  if (allRest && items.length) total = maxLeft;
  total = Math.max(0, Math.min(total, maxLeft));
  const pays = []; let rest = total;
  /* avval naqd bo'lmagan turlarga (nasiya, karta), keyin naqdga: pul qayerdan kelgan bo'lsa, o'sha yerga qaytadi */
  const order = r.pays.slice().sort((a, b) => (a.m === 'cash') - (b.m === 'cash'));
  for (const p of order) { const avail = num(p.a) - (r.refundedBy[p.m] || 0); const a = Math.min(rest, Math.max(0, avail)); if (a > 0) { pays.push({ m: p.m, a }); rest -= a; } }
  return { items, total, pays };
}

MOD.find = m => ({ title: 'Chekni topish', focus: '#fno', enter: 'findOk',
  body: `<label class="f">Chek raqami<input class="inp" id="fno" data-in="f" data-f="no" placeholder="Masalan: ${esc(S.dev && S.dev.code ? S.dev.code : 1)}-000012" value="${esc(m.f.no || '')}" autocomplete="off"></label>
    <p class="note" style="margin-top:8px">To‘liq raqamni yoki shu kassadagi chekning tartib raqamini kiriting. Shu do‘konning oxirgi ${num(CFG().keepDays)} kunlik cheklari qidiriladi.</p>${m.busy ? '<div class="toolbar" style="margin-top:10px"><div class="spin"></div><span class="note">Qidirilmoqda…</span></div>' : ''}${errLine(m)}`,
  foot: `<button class="btn" data-a="closeModal">Bekor qilish</button><button class="btn pri" data-a="findOk" ${m.busy ? 'disabled' : ''}>Topish</button>` });
async function findReceipt(m) {
  const v = String(m.f.no || '').trim(); if (!v) return fErr(m, 'Chek raqamini kiriting');
  const st = S.dev.store, M0 = model();
  let code = num(S.dev.code) || 1, n = 0;
  if (/^\d+-\d+$/.test(v)) { const [a, b] = v.split('-'); code = num(a); n = num(b); } else if (/^\d+$/.test(v)) n = num(v); else return fErr(m, 'Raqam noto‘g‘ri');
  const no = code + '-' + String(n).padStart(6, '0');
  let id = M0.byNo.get(st + '|' + no);
  if (!id && S.db) {
    m.busy = true; m.err = ''; renderModal();
    try {
      const devs = [...S.devs.values()].filter(d => d.store === st && d.type === 'cashier' && num(d.code) === code);
      for (const d of devs) {
        const snap = await withTimeout(S.db.collection('sum').where('dev', '==', d.id).where('r0', '<=', n).get(), 25000);
        const hit = snap.docs.map(x => x.data()).filter(s => num(s.r1) >= n).sort((a, b) => a.day < b.day ? 1 : -1)[0];
        if (hit) { await loadRaw(hit.day, hit.day); break; }
      }
    } catch (e) { handleDbErr(e, 'find'); }
    m.busy = false;
    id = model().byNo.get(st + '|' + no);
  }
  if (!id) return fErr(m, 'Bu do‘konda bunday chek topilmadi');
  dropModal(m); pushModal({ type: 'receipt', id });
}

/* Excel'dan nusxa olingan jadvalni tahlil qilish */
function parseImport(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], errors: [], header: false };
  const split = l => l.includes('\t') ? l.split('\t') : l.split(/;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x => x.replace(/^"|"$/g, '').replace(/""/g, '"'));
  let cols = { name: 0, price: 1, barcode: 2, cat: 3, unit: 4 }, start = 0, header = false;
  const h = split(lines[0]).map(norm);
  const find = keys => h.findIndex(x => keys.some(k => x.includes(k)));
  const ni = find(['nom', 'name', 'mahsulot', 'наим']), pi = find(['narx', 'price', 'цен']);
  if (ni >= 0 && pi >= 0) {
    header = true; start = 1;
    cols = { name: ni, price: pi, barcode: find(['shtrix', 'barcode', 'kod', 'sku', 'штрих']), cat: find(['bo\'lim', 'kategor', 'category', 'катег']), unit: find(['o\'lchov', 'birlik', 'unit', 'ед']) };
  }
  const rows = [], errors = [];
  for (let i = start; i < lines.length; i++) {
    const c = split(lines[i]), get = k => cols[k] >= 0 ? String(c[cols[k]] ?? '').trim() : '';
    const name = get('name'), price = num(get('price').replace(/[.,]\d{1,2}$/, ''));
    if (!name) { errors.push(`${i + 1}-qator: nomi yo‘q`); continue; }
    if (!(price > 0)) { errors.push(`${i + 1}-qator (${name}): narx noto‘g‘ri`); continue; }
    let unit = norm(get('unit')); if (!UNITS.includes(unit)) unit = /kg|кг/.test(unit) ? 'kg' : /^l|литр/.test(unit) ? 'l' : 'dona';
    rows.push({ name, price, barcode: get('barcode').replace(/\s/g, ''), cat: get('cat') || 'Boshqa', unit });
  }
  return { rows, errors, header };
}
function importPlan(rows) {
  const byBar = new Map(), byName = new Map();
  for (const p of PRODUCTS()) { if (p.barcode) byBar.set(p.barcode, p); byName.set(norm(p.name), p); }
  const out = []; let nNew = 0, nUpd = 0;
  for (const r of rows) {
    const ex = (r.barcode && byBar.get(r.barcode)) || byName.get(norm(r.name));
    if (ex) { out.push(Object.assign({}, ex, { name: r.name, price: r.price, cat: r.cat, unit: r.unit, barcode: r.barcode || ex.barcode || '' })); nUpd++; }
    else { out.push({ id: 'p' + uid(8), name: r.name, price: r.price, cat: r.cat, unit: r.unit, barcode: r.barcode, fav: false, active: true }); nNew++; }
  }
  return { list: out, nNew, nUpd };
}
MOD.import = m => {
  const P = parseImport(m.f.text), plan = importPlan(P.rows);
  return { title: 'Excel’dan import', cls: 'wide',

      ${P.errors.length ? `<details style="margin-top:8px"><summary class="note">Xatolarni ko‘rsatish</summary><pre class="csvprev">${esc(P.errors.slice(0, 50).join('\n'))}</pre></details>` : ''}${errLine(m)}`,

const EVT_GROUP = { sale: 'Sotuv', void: 'Bekor qilish', refund: 'Qaytarish', cash: 'Pul harakati', debt_pay: 'Nasiya', debt_adj: 'Nasiya', cust_add: 'Nasiya', shift_open: 'Smena', shift_close: 'Smena', correction: 'Smena', login: 'Kirish', item_remove: 'Pozitsiya', cart_clear: 'Pozitsiya', admin: 'Sozlamalar', device: 'Qurilma' };
function evText(e) {
  const r = e.r || {};
  switch (e.t) {
    case 'login': return ['Tizimga kirdi', ''];
    case 'device': return ['Qurilma ulandi', `${e.name}, ${e.type === 'cashier' ? 'kassa №' + e.code : 'kuzatuv'}${e.by ? ', ruxsat: ' + uname(e.by) : ''}`];
    case 'shift_open': return ['Smena ochildi', 'Boshlang‘ich naqd ' + som(e.cash)];
    case 'sale': return ['Sotuv', `Chek ${r.no}, ${som(r.total)}, ${paysText(r.pays)}${num(r.disc) > 0 ? ', chegirma ' + som(r.disc) + ' (' + (r.discReason || '') + ')' : ''}${r.cust ? ', mijoz: ' + custName(r.cust) : ''}`];
    case 'void': return ['Chek bekor qilindi', `Chek ${e.no}, ${som(e.amount)}. Sabab: ${e.reason}. Tasdiqladi: ${uname(e.by)}`];
    case 'refund': return ['Qaytarish', `Chek ${e.no}, ${som(e.total)}. Sabab: ${e.reason}. Tasdiqladi: ${uname(e.by)}`];
    case 'cash': return [MOVE[e.kind] || 'Pul harakati', `${som(e.amount)}. ${e.reason}${e.person ? '. Kim: ' + e.person : ''}${e.by ? '. Tasdiqladi: ' + uname(e.by) : ''}`];
    case 'debt_pay': return ['Nasiya to‘lovi', `${custName(e.cust)}: ${som(e.amount)}, ${mname(e.m)}`];
    case 'debt_adj': return ['Nasiya tuzatildi', `${custName(e.cust)}: ${sgn(e.amount)}. ${e.reason || ''}`];
    case 'cust_add': return ['Yangi mijoz', e.name || ''];
    case 'item_remove': return ['Ochiq chekdan olib tashlandi', `${e.name}, ${fq(e.qty)} × ${fmt(e.price)}`];
    case 'cart_clear': return ['Ochiq chek tozalandi', `${num(e.n)} ta pozitsiya, ${som(e.sum)}`];
    case 'shift_close': return ['Smena yopildi', `Sanalgan ${som(e.counted)}, kutilgan ${som(e.expected)}, farq ${sgn(e.variance)}${e.reason ? '. Sabab: ' + e.reason : ''}`];
    case 'correction': return ['Tuzatish yozuvi', `${sgn(e.amount)}. ${e.reason}`];
    case 'admin': return ['Sozlamalar', e.text || ''];
    default: return [e.t, ''];
  }
}

      <p class="note" style="margin-top:8px">Har bir yozuv oldingisiga shifrlangan zanjir bilan bog‘langan. Yozuv o‘chirilsa yoki o‘zgartirilsa, shu yerda va ogohlantirishlarda ko‘rinadi.</p></section>` : ''}
    <div class="sec" style="padding:4px 8px"><div class="tw">${list.length ? `<table class="tbl"><thead><tr><th>Vaqt</th><th>#</th><th>Xodim</th><th>Qurilma</th><th>Harakat</th><th>Tafsilot</th></tr></thead><tbody>

Object.assign(ACT, {

  moreClose: () => { S.ui.more = false; render(); },
  lock: () => doLock(),
  reclaim: () => claimTab(true),
  ovl: (d, el, ev) => { if (ev.target === el) { const m = topModal(); if (m && m.busy) return; popModal(); } },
  closeModal: () => { const m = topModal(); if (m && m.busy) return; popModal(); },
  setF: d => { const m = topModal(); if (!m) return; m.f[d.f] = d.v; if (d.f === 'mode') m.f.val = ''; m.err = ''; renderModal(); },

  connBack: () => { S.ui.conn.who = null; S.ui.conn.pin = ''; S.ui.conn.err = ''; render(); },

  resetDevGo: () => { resetLocalDevice(); S.ui.conn = null; render(); },

  who: d => { S.ui.who = d.id; S.ui.pin = ''; S.ui.pinErr = ''; render(); },
  whoBack: () => { S.ui.who = null; S.ui.pin = ''; S.ui.pinErr = ''; render(); },
  pin: d => pinKey(d.k),
  apWho: d => { const m = topModal(); if (!m) return; m.who = d.id; m.pin = ''; m.err = ''; m._focused = false; renderModal(); },
  apBack: () => { const m = topModal(); if (!m) return; m.who = null; m.pin = ''; m.err = ''; renderModal(); },
  apin: d => apinKey(d.k),

  /* smena va sotuv */
  openShift: () => {

    const e = emit('shift_open', { shift: uid(12), cash: num(S.ui.ocash) });

    S.ui.ocash = ''; toast('Smena ochildi'); render();
  },
  cat: d => { S.ui.cat = d.k; S.ui.q = ''; const qi = $('#q'); if (qi) qi.value = ''; document.querySelectorAll('#cats .chip').forEach(c => c.classList.toggle('on', c.dataset.k === d.k)); const pl = $('#plist'); if (pl) pl.innerHTML = productsHTML(); },
  add: d => { const p = PR(d.id); if (!p || !p.active) return; if (p.unit === 'kg' || p.unit === 'l' || p.unit === 'm') pushModal({ type: 'qty', pid: p.id, f: { q: '' } }); else addToCart(p, 1); },
  qty: d => { const it = S.cart.items[+d.i]; if (!it) return; setQty(+d.i, it.qty + ((it.unit === 'dona' || it.unit === 'quti') ? 1 : 0.1) * (+d.d)); },
  qtyEdit: d => { const it = S.cart.items[+d.i]; if (it) pushModal({ type: 'qty', i: +d.i, f: { q: fq(it.qty) } }); },
  qtyOk: () => {

    if (m.pid) { if (q > 0) addToCart(it, q); } else setQty(m.i, q);
  },
  rmItem: d => setQty(+d.i, 0),
  cartClear: () => {
    const sh = curShift(), k = cartCalc();
    if (sh && S.cart.items.length) emit('cart_clear', { shift: sh.id, n: S.cart.items.length, sum: k.sub, names: S.cart.items.map(i => i.name).slice(0, 20) });
    S.cart = { items: [], disc: null }; refreshCart();
  },
  cartOpen: () => { S.ui.cartOpen = true; const c = $('#cart'); if (c) c.classList.add('open'); },
  cartClose: () => { S.ui.cartOpen = false; const c = $('#cart'); if (c) c.classList.remove('open'); },
  disc: () => { const d = S.cart.disc; pushModal({ type: 'disc', f: d ? { mode: d.pct ? 'pct' : 'sum', val: String(d.pct || d.amount), reason: ['Doimiy xaridor', 'Aksiya', 'Nuqsonli mahsulot'].includes(d.reason) ? d.reason : 'Boshqa', note: d.reason } : { mode: 'pct', val: '' } }); },
  discDel: () => { S.cart.disc = null; popModal(); refreshCart(); },
  discOk: () => {
    const m = topModal(), f = m.f, k = cartCalc(), v = num(f.val), reason = reasonOf(m);
    if (!v) return fErr(m, 'Chegirma miqdorini kiriting');
    if (f.mode === 'pct' && v >= 100) return fErr(m, 'Foiz 100 dan kichik bo‘lishi kerak');
    if (f.mode === 'sum' && v >= k.sub) return fErr(m, 'Chegirma chek summasidan kichik bo‘lishi kerak');
    if (!reason) return fErr(m, 'Sababni tanlang yoki yozing');
    const pct = f.mode === 'pct' ? v : v / k.sub * 100, over = pct > num(CFG().discLimit);
    const apply = by => { S.cart.disc = { pct: f.mode === 'pct' ? v : 0, amount: f.mode === 'sum' ? v : 0, reason, by }; dropModal(m); refreshCart(); };
    if (over) requireApproval(`Chegirma ${fq(Math.round(pct * 10) / 10)}%: chegara ${CFG().discLimit}%`, apply);
    else apply(null);
  },
  pay: () => { if (!S.cart.items.length) return; pushModal({ type: 'pay', method: 'cash', f: {} }); },
  payM: d => { const m = topModal(); m.method = d.k; m._focused = false; m.err = ''; renderModal(); },
  quick: d => { const m = topModal(); m.f.given = d.v; const g = $('#given'); if (g) g.value = fmt(+d.v); updPayUI(); },

    m.f['mix_' + d.k] = String(Math.max(0, t - others)); const el = $('#mix_' + d.k); if (el) el.value = moneyVal(m.f['mix_' + d.k]); updPayUI();
  },
  custPick: d => { const m = topModal(); m.f.cust = d.id; m.err = ''; renderModal(); },
  custClear: () => { const m = topModal(); m.f.cust = null; renderModal(); },
  ncOpen: () => { const m = topModal(); m.f.newCust = true; m.f.ncName = m.f.cq || ''; m._focused = false; renderModal(); const el = $('#nc_name'); if (el) el.focus(); },
  ncCancel: () => { const m = topModal(); m.f.newCust = false; renderModal(); },
  ncSave: () => {
    const m = topModal(), name = String(m.f.ncName || '').trim();
    if (!name) return fErr(m, 'Mijoz ismini kiriting');
    const c = addCustomer({ name, phone: String(m.f.ncPhone || '').trim() });
    if (!c) return fErr(m, 'Qurilma xotirasi to‘lgan');
    m.f.cust = c.id; m.f.newCust = false; m.err = ''; renderModal();
  },
  payOk: () => {
    const m = topModal(); if (!m || m.type !== 'pay') return;
    const t = cartCalc().total; if (!payOk(m, t)) return fErr(m, payNas(m, t) > 0 && !m.f.cust ? 'Nasiya uchun mijozni tanlang' : 'To‘lov summasi mos emas');
    let pays, given = 0, change = 0;
    if (m.method === 'cash') { const g = num(m.f.given) || t; pays = [{ m: 'cash', a: t }]; given = g; change = g - t; }
    else if (m.method === 'mix') pays = activeMethods().map(x => ({ m: x.k, a: num(m.f['mix_' + x.k]) })).filter(p => p.a > 0);
    else pays = [{ m: m.method, a: t }];
    const nas = nasiyaPart(pays), extra = {};
    if (nas > 0) {

      if (lim && bal + nas > lim) return requireApproval(`Nasiya limiti: ${custName(m.f.cust)} qarzi ${som(bal + nas)} bo‘ladi`, by => doSale(pays, given, change, Object.assign(extra, { debtOver: true, debtBy: by })));

  /* cheklar */

  if (!S.cfg) return S.mode ? (canAdminCfg() ? vOnboard() : vNotSetup()) : vBoot('Ulanmoqda…');
  if (!S.dev) return vConnect();
  if (devBlocked()) return vBlocked();
  if (!S.user) return vLogin();
  return vShell();
}

document.addEventListener('click', e => {

  if (S.passive && a !== 'reclaim') return;

  catch (err) { console.error(err); toast('Xato: ' + ((err && err.message) || 'noma’lum'), 'bad'); }
});

let scanBuf = '', scanT = 0;
document.addEventListener('keydown', e => {
  S.last = Date.now();
  const m = topModal(), t = e.target, tag = t.tagName, inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (e.key === 'Escape') { if (S.ui.more) { S.ui.more = false; render(); return; } if (m && !m.busy) { e.preventDefault(); popModal(); } return; }
  if (S.passive) return;
  const digit = /^\d$/.test(e.key);
  if (!S.readOnly && !S.dev) {
    if (S.ui.conn && S.ui.conn.who && !inField) { if (digit) ACT.connPin({ k: e.key }); else if (e.key === 'Backspace') ACT.connPin({ k: 'bk' }); else if (e.key === 'Enter') { e.preventDefault(); ACT.connPin({ k: 'ok' }); } }
    return;
  }
  if (!S.readOnly && !S.user) { if (!inField && S.ui.who) { if (digit) pinKey(e.key); else if (e.key === 'Backspace') pinKey('bk'); else if (e.key === 'Enter') { e.preventDefault(); pinKey('ok'); } } return; }
  if (m && m.type === 'approve') { if (m.who) { if (digit) apinKey(e.key); else if (e.key === 'Backspace') apinKey('bk'); else if (e.key === 'Enter') { e.preventDefault(); apinKey('ok'); } } return; }
  if (m) { if (e.key === 'Enter' && tag === 'INPUT' && t.type !== 'checkbox') { const r = MOD[m.type](m); if (r.enter && ACT[r.enter]) { e.preventDefault(); ACT[r.enter]({}); } } return; }
  if (t.id === 'ocash' && e.key === 'Enter') { e.preventDefault(); ACT.openShift(); return; }
  if (S.view === 'pos') {
    if (t.id === 'q') { if (e.key === 'Enter') { e.preventDefault(); scanOrPick(t.value); } return; }
    if (inField) return;
    if (e.key === 'Enter') { if (scanBuf.length >= 4) { e.preventDefault(); scanOrPick(scanBuf); } scanBuf = ''; return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { const now = Date.now(); if (now - scanT > 100) scanBuf = ''; scanBuf += e.key; scanT = now; }
  }
});
['pointerdown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { S.last = Date.now(); }, { passive: true }));
window.addEventListener('online', () => { if (S.mode === 'remote' && !S.revoked && !S.writeDenied) S.net = 'online'; schedulePush(200); renderStatus(); });
window.addEventListener('offline', () => { if (S.mode === 'remote') S.net = 'offline'; renderStatus(); });

let tick = 0;
setInterval(() => {
  tick++;
  const c = $('#clock'); if (c) c.textContent = hm(Date.now());

async function boot() {

      [db, userNs, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')].map(p => Promise.resolve(p).catch(() => null)));
    }
  } catch (e) { db = null; }
  S.dl = dl || null;
  if (db) {
    S.db = db; S.mode = 'remote'; S.userNs = userNs;
    try { S.isOwner = userNs ? !!(await userNs.isOwner()) : null; } catch (e) { S.isOwner = null; }
    try { S.canWrite = userNs ? await userNs.can('data.write') : null; } catch (e) { S.canWrite = null; }
    if (S.canWrite === false) { S.readOnly = true; S.user = { id: '_ro', name: 'Kuzatuvchi', role: 'viewer', stores: [] }; }

    S.db = new LocalDB(LSP + 'db:'); S.mode = 'local'; S.isOwner = true; S.canWrite = true; S.net = 'local';

}
